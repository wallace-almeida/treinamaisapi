name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos
  workflow_dispatch:        # permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TreinaMais API
        run: |
          curl -s https://treinamaisapi.onrender.com/treinamais-api/api/temas > /dev/null
