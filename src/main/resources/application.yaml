---
spring:
  profiles:
    active: local

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    schemas: public
    validate-on-migrate: true


  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate # update para quando criar na primeira
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

mercadopago:
  access-token: ${MP_ACCESS_TOKEN_SANDBOX}
  public-key: ${MP_PUBLIC_KEY_SANDBOX}
  webhook-url: "https://palpitant-tanya-rightly.ngrok-free.dev/treinamais-api/api/comprar/pix"

ambiente:
  nmAmbiente: DESENVOLVIMENTO-HML
logging:
  level:
    root: info
    org:
      springframework:
        kafka: error
    apache:
      kafka:
        clients:
          NetworkClient: error
server:
  port: 8094
